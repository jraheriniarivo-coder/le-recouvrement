/* ===== MAIN CONTENT ===== */
.container{
  max-width: 1000px;
  margin: 40px auto;
  padding: 0 20px;
}
.page-header{
  text-align: center;
  margin-bottom: 40px;
}
.page-header h1{
  font-size: 32px;
  font-weight: 900;
  color: var(--sapphire);
  margin-bottom: 8px;
}
.page-header p{
  color: var(--text-medium);
  font-size: 16px;
}

/* ===== QUESTION BLOCKS ===== */
.question-block{
  background: #fff;
  border-radius: 16px;
  padding: 28px;
  margin-bottom: 24px;
  box-shadow: 0 4px 20px rgba(0,0,0,.04);
  border-left: 5px solid var(--primary);
}
.q-meta{
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 16px;
}
.q-tag{
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1px;
  padding: 4px 12px;
  border-radius: 12px;
}
.q-tag.j1{background: rgba(13,71,161,.1); color: var(--sapphire)}
.q-tag.j2{background: rgba(255,169,0,.15); color: #b37b00}
.q-tag.j3{background: rgba(9,100,117,.1); color: var(--success)}
.q-tag.j4{background: rgba(124,77,255,.1); color: var(--violet)}
.q-number{
  font-weight: 900;
  color: var(--text-light);
  font-size: 14px;
}
.q-title{
  font-size: 20px;
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 20px;
  line-height: 1.4;
}

/* Options */
.options-list{
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.option-item{
  background: #f8fafc;
  border: 1px solid #e2e8f0;
  border-radius: 10px;
  padding: 16px;
  display: flex;
  gap: 16px;
  align-items: flex-start;
}
.option-item.correct{
  background: #f0fdf4;
  border-color: #86efac;
}
.option-item.correct .opt-letter{
  background: var(--success);
  color: #fff;
}
.opt-letter{
  width: 28px;
  height: 28px;
  background: #e2e8f0;
  color: var(--text-medium);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 13px;
  flex-shrink: 0;
}
.opt-content{ flex: 1; }
.opt-text{
  font-weight: 700;
  color: var(--text-dark);
  margin-bottom: 6px;
  font-size: 15px;
}
.opt-reason{
  font-size: 14px;
  color: var(--text-light);
  line-height: 1.5;
}
.opt-reason strong{
  color: var(--success);
}

/* Gap / Axe d'amélioration */
.gap-box{
  margin-top: 16px;
  background: #fffbeb;
  border-left: 3px solid var(--accent);
  padding: 12px 16px;
  border-radius: 0 8px 8px 0;
  font-size: 14px;
  color: #92400e;
  display: flex;
  align-items: center;
  gap: 10px;
}
.gap-box i{ color: var(--accent); }

@media(max-width: 768px) {
  .top-bar{padding: 10px 16px; flex-direction: column; gap: 12px; align-items: flex-start;}
  .question-block{padding: 20px;}
  .option-item{flex-direction: column; gap: 8px;}
}

/* GÉNÉRATION DE LA VUE MASTER                  */
/* ============================================ */
function renderMasterView() {
  const container = document.getElementById('quiz-container');
  let html = '';

  QUESTIONS.forEach((q, index) => {
    // Identifier la bonne réponse (poids = 3)
    const correctIndex = q.opts.findIndex(o => o.w === 3);

    html += `
      <div class="question-block">
        <div class="q-meta">
          <span class="q-tag j${q.day}">${q.tag}</span>
          <span class="q-number">Question ${index + 1} / ${QUESTIONS.length}</span>
        </div>
        <div class="q-title">${q.q}</div>
        
        <div class="options-list">
          ${q.opts.map((opt, i) => {
            const isCorrect = (i === correctIndex);
            const letter = ['A', 'B', 'C', 'D'][i];
            
            return `
              <div class="option-item ${isCorrect ? 'correct' : ''}">
                <div class="opt-letter">${isCorrect ? '<i class="fas fa-check"></i>' : letter}</div>
                <div class="opt-content">
                  <div class="opt-text">${opt.t} ${isCorrect ? '<span style="color:var(--success);font-size:12px;margin-left:8px;">(Bonne réponse)</span>' : ''}</div>
                  <div class="opt-reason">
                    ${isCorrect ? '<strong><i class="fas fa-lightbulb"></i> Justification : </strong>' : '<i class="fas fa-times-circle" style="color:#cbd5e1"></i> '}
                    ${opt.r}
                  </div>
                </div>
              </div>
            `;
          }).join('')}
        </div>

        ${q.opts[correctIndex].g ? `
          <div class="gap-box">
            <i class="fas fa-arrow-trend-up"></i>
            <div><strong>Axe d'amélioration associé (si erreur) :</strong> ${q.opts[correctIndex].g}</div>
          </div>
        ` : ''}
        
        <!-- Affichage des autres axes de progression pour les mauvaises réponses -->
        ${q.opts.some((opt, i) => i !== correctIndex && opt.g) ? `
          <div style="margin-top:12px; font-size:12px; color:var(--text-light); padding-left:16px;">
            <em>Autres axes possibles selon le choix de l'apprenant :</em>
            <ul style="margin-left: 20px; margin-top: 4px;">
              ${q.opts.map((opt, i) => (i !== correctIndex && opt.g) ? `<li>Choix ${['A','B','C','D'][i]} : ${opt.g}</li>` : '').join('')}
            </ul>
          </div>
        ` : ''}
      </div>
    `;
  });

  container.innerHTML = html;
}

// Lancer l'affichage
renderMasterView();
</script>
