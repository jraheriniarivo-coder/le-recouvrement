<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Connexion — Espace Formateur</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Manrope:wght@800&display=swap" rel="stylesheet">
<style>
  :root { --accent: #0ea5e9; --primary: #0f172a; --bg: #f4f7fb; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'DM Sans', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; height: 100vh; }
  .login-card { background: #fff; padding: 40px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); width: 100%; max-width: 400px; text-align: center; border: 1px solid #e2e8f0; }
  h1 { font-family: 'Manrope', sans-serif; color: var(--primary); font-size: 24px; font-weight: 800; margin-bottom: 10px; }
  p { color: #718096; font-size: 14px; margin-bottom: 30px; }
  
  input { width: 100%; padding: 14px; border: 1px solid #e2e8f0; border-radius: 8px; font-size: 24px; outline: none; font-family: inherit; letter-spacing: 8px; text-align: center; transition: 0.2s; }
  input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(14,165,233,0.1); }
  
  .error { color: #ef4444; font-size: 14px; margin-top: 15px; display: none; font-weight: 500; }
</style>
</head>
<body>

<div class="login-card">
  <h1>Accès sécurisé</h1>
  <p>Entrez votre code à 6 chiffres.</p>
  
  <!-- ✅ On limite à 6 caractères et on vérifie à chaque frappe -->
  <input type="password" id="password" placeholder="••••••" maxlength="6" autofocus oninput="if(this.value.length === 6) login()">
  
  <div class="error" id="error-msg">Code incorrect.</div>
</div>

<script>
function login() {
  const password = document.getElementById('password').value;
  
  // ⚠️ TON MOT DE PASSE EST ICI ⚠️
  const MOT_DE_PASSE_SECRET = "220721"; 

  if (password === MOT_DE_PASSE_SECRET) {
    // Si c'est bon, on change la couleur en vert et on redirige
    document.getElementById('password').style.borderColor = '#10b981';
    document.getElementById('password').style.color = '#10b981';
    sessionStorage.setItem('connecteo_auth', 'true');
    
    // Petite pause d'une demi-seconde pour l'effet visuel
    setTimeout(() => {
      window.location.href = 'index.html';
    }, 500);
    
  } else {
    // Si c'est faux, on affiche l'erreur et on vide le champ
    document.getElementById('error-msg').style.display = 'block';
    document.getElementById('password').value = '';
    document.getElementById('password').focus();
  }
}
</script>
</body>
</html>
